{% extends "base.html" %}
{% block content %}
<section class="auth-wrap">
  <div class="panel-card auth-panel">
    <div class="panel-header" style="text-align: center; margin-bottom: 24px;">
      <div style="display: flex; justify-content: center; margin-bottom: 16px;">
        <div class="brand-icon" style="width: 52px; height: 52px;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </div>
      </div>
      <div style="font-size: 0.8rem; font-weight: 800; color: var(--coral); letter-spacing: 0.1em; margin-bottom: 4px;">
        「 ログイン 」 AUTHENTICATION
      </div>
      <h1 style="font-size: 1.8rem; font-weight: 900; margin: 0 0 8px;">Sign in to Copy Paste</h1>
      <p style="color: var(--text-secondary); font-size: 0.95rem; margin: 0;">Enter your credentials to access your workspaces and notes.</p>
    </div>

    {% if error %}
      <div class="alert alert-danger">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <form action="/login" method="post">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrap has-icon">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <input id="username" name="username" value="admin" autocomplete="username" required autofocus>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap has-icon">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input id="password" name="password" type="password" value="admin" autocomplete="current-password" required>
        </div>
      </div>

      <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 8px;">
        <span>Sign in</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>

    <div class="demo-credentials">
      <div style="font-weight: 700; margin-bottom: 4px; color: var(--text-primary); display: flex; align-items: center; gap: 6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--coral);">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        Default Initial Access:
      </div>
      Username: <strong>admin</strong> &bull; Password: <strong>admin</strong>
    </div>
  </div>
</section>
{% endblock %}
