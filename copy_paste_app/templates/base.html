<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Japanese minimalist modern workspace for code snippets, live notes, and projects with instant auto-save.">
    <title>{{ title or "Copy Paste · Modern Code Notes" }}</title>
    
    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}?v=14">
    
    <!-- Theme Initializer (prevents theme flicker) -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem('cp_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);
      })();
    </script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Copy Paste Home">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </div>
        <div class="brand-title">
          <span>Copy<span class="brand-accent">Paste</span></span>
          <span class="brand-kanji">コピー・ペースト</span>
        </div>
      </a>
      
      <div class="nav-actions">
        <!-- Theme Switcher -->
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark/light theme" title="Toggle theme">
          <!-- Moon Icon (shown in light mode) -->
          <svg class="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <!-- Sun Icon (shown in dark mode) -->
          <svg class="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>

        {% if user %}
          <div class="user-badge">
            <span class="user-avatar">{{ user.username[0] | upper }}</span>
            <span class="user-name">{{ user.username }}</span>
          </div>
          <form action="/logout" method="post" style="margin: 0;">
            <button class="btn btn-ghost btn-sm" type="submit">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
              <span>Sign out</span>
            </button>
          </form>
        {% else %}
          <a class="btn btn-primary btn-sm" href="/login">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            <span>Sign in</span>
          </a>
        {% endif %}
      </div>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
      <div>
        <strong>Copy Paste</strong> &bull; Japanese Minimalist Canvas for Live Code Notes &amp; Fast Snippets.
      </div>
      <div>
        <span style="color: var(--coral); font-weight: 700;">ミニマル</span> &bull; MongoDB Powered &bull; Instant Auto-Save
      </div>
    </footer>

    <!-- Global Toast Container -->
    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <script>
      // Theme Switcher & Toast Helper
      (function() {
        const toggleBtn = document.getElementById('themeToggle');
        if (toggleBtn) {
          toggleBtn.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('cp_theme', next);
          });
        }
      })();

      window.showToast = function(message, type = 'normal') {
        const container = document.getElementById('toastContainer');
        if (!container) return;
        const isError = type === 'error';
        const icon = isError
          ? '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>'
          : '<polyline points="20 6 9 17 4 12"></polyline>';
        const toast = document.createElement('div');
        toast.className = `toast toast-${isError ? 'error' : type === 'success' ? 'success' : 'normal'}`;
        toast.setAttribute('role', isError ? 'alert' : 'status');
        toast.innerHTML = `
          <svg class="toast-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>
          <span></span>
        `;
        toast.querySelector('span').textContent = message;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(10px)';
          setTimeout(() => toast.remove(), 250);
        }, isError ? 5000 : 2600);
      };
    </script>
    {% if flash %}
      <script>window.showToast({{ flash.message | tojson }}, {{ flash.type | tojson }});</script>
    {% endif %}
  </body>
</html>
