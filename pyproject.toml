[project]
name = "copy-paste"
version = "0.1.0"
description = "Modern web application for projects, topics, and live code notes"
readme = "README.md"
license = { text = "CC-BY-4.0" }
requires-python = ">=3.11,<3.13"

authors = [
   { name = "John K. Barrera", email = "jbarreracontrera@worldbank.org" },
]
maintainers = [
    { name = "John K. Barrera", email = "jbarreracontrera@worldbank.org" },
]
keywords = ["notes", "editor", "fastapi", "mongodb"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.35.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.1.1",
    "pymongo>=4.15.0",
    "boto3>=1.43.102",
]


[tool.uv]

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mongomock>=4.3.0",
    "moto>=5.2.3",
]
